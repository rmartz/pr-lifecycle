version: 2

# @rmartz/repo-hygiene (the pre-commit CLI devDependency) publishes to GitHub
# Packages, so Dependabot needs registry auth to see new versions. Without the
# DEPENDABOT_PACKAGES_TOKEN Dependabot secret (a classic PAT scoped to
# read:packages) the npm job dies with a 422 and silently stops opening ALL npm
# PRs, not just the @rmartz one. The repo-root .npmrc pins npmjs as the base
# registry so public deps don't resolve against GitHub Packages
# (dependabot-core#15415).
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.DEPENDABOT_PACKAGES_TOKEN}}

# Cooldown: since 2026-07-14 Dependabot waits 3 days after a release before
# proposing it, even with no `cooldown` configured. Third-party dependencies keep
# that default (security updates are never delayed by it).
# - github-actions exempts first-party `rmartz/*` actions and reusable workflows:
#   they're published from our own repos, so the wait only holds fixes back.
# - npm declares NO `cooldown` block. An explicit npm cooldown is passed to pnpm
#   as `minimumReleaseAge`, which hard-fails lockfile resolution
#   (ERR_PNPM_NO_MATURE_MATCHING_VERSION) whenever any transitive dependency is
#   younger than the window, so grouped updates close as "no longer updatable"
#   (rmartz/pr-shepherd#374). The implicit default isn't forwarded to pnpm.
updates:
  - package-ecosystem: npm
    directory: /
    registries:
      - github-packages
    schedule:
      interval: weekly
    commit-message:
      # Production deps ship to consumers → `fix` cuts a patch release.
      # Dev deps never reach the published artifact → release-less `chore`.
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # Prettier isolated (case-by-case choice): any Prettier bump, even a minor,
      # can reformat the tree and fail the Format check, so it gets its own PR.
      # No update-types filter, so its majors stay in this group too.
      prettier:
        patterns:
          - 'prettier'
      # TypeScript isolated (case-by-case choice): a compiler bump can change
      # type-checking across the whole codebase, and typescript-eslint pins a
      # supported TS range, so it warrants its own reviewable PR.
      typescript:
        patterns:
          - 'typescript'
      # Catch-all groups batch patch and minor bumps, which auto-merge. A major
      # matches no group, so Dependabot opens it as its own PR for review instead
      # of holding every routine bump in the group (rmartz/ai repository
      # checklist §Supply chain).
      dev-dependencies:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # Explicit, so declaring the block can't change the third-party default.
      default-days: 3
      exclude:
        - 'rmartz/*'
    commit-message:
      # CI tooling never reaches the published artifact → always `chore`.
      # (prefix-development has no meaning for GHA; without this override a GHA
      # bump would fall through to `fix` and cut a spurious release.)
      prefix: chore
      include: scope
    groups:
      # Patch and minor only; each major gets its own PR (see the npm groups).
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
