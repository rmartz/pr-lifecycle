name: pr-lifecycle
# Shows which event and action started each run (e.g. pull_request_target /
# review_request_removed), so the run list says what re-reconciled a PR.
run-name: pr-lifecycle (${{ github.event_name }}${{ github.event.action && format('/{0}', github.event.action) || '' }})

# Dogfoods this repo's own reconciler through the published, SHA-pinned
# rmartz/pr-lifecycle-action, the same path consumers use (#10). On every
# relevant event it recomputes each PR's lifecycle state, converges its labels,
# and arms GitHub-native auto-merge when the PR reaches `approved` (including
# an eligible Dependabot or release-please PR; see docs/bot-eligibility.md).
#
# SAFETY: auto-merge lands the moment the default-branch ruleset's required
# checks pass (CI, Repo hygiene, pr-policy, release-check, merge-safety).
# This is only safe while those checks are REQUIRED on main.
#
# Every read and write goes through an installation token for the
# rmartz-merge-bot GitHub App, not GITHUB_TOKEN, so labels are attributed to the
# bot and API calls draw on the App's own rate-limit pool rather than the
# user's (rmartz/scripts#22). Unlike GITHUB_TOKEN, App-authored events trigger
# workflows, so the job skips the label and review-request events the App
# itself causes; see the job's `if`.

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft
      - synchronize
      - edited
      - labeled
      - unlabeled
      # A bot review request that lands (or is removed) after the run's settle
      # wait moves the PR into (or out of) awaiting-bot-review.
      - review_requested
      - review_request_removed
  pull_request_review:
    types: [submitted, dismissed, edited]
  # CI completion re-routes a PR through the CI gate. check_suite never fires for
  # suites GitHub Actions creates, so workflow_run lists this repo's required
  # Actions workflows. That includes pr-policy: the CI gate ignores a hold
  # check's pending but counts its failure, so its failing-to-passing transition
  # needs a re-reconcile to clear `ci failing`. merge-safety needs no entry: the
  # CI gate ignores it and its `update required` label fires `labeled`.
  check_suite:
    types: [completed]
  workflow_run:
    workflows: [CI, Repo Hygiene, Release check, pr-policy]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to reconcile
        required: true

# GITHUB_TOKEN is unused: the App token below carries every permission the
# action needs, including contents:write to merge and update branches.
permissions: {}

jobs:
  reconcile:
    name: Reconcile PR lifecycle
    # A review on a fork PR runs with a read-only token, so it can't write
    # labels; skip it. The fork PR is reconciled on its next
    # pull_request_target event, or on demand via workflow_dispatch.
    #
    # Also skip the label and review-request events this workflow's own writes
    # cause. Every run recomputes the PR from its current facts, so the run that
    # wrote them already converged, and a follow-up run would only no-op while
    # cancelling the in-flight writer. Only the App's own login is excluded: a
    # label from a person or another workflow still re-reconciles. The App's
    # arm, merge, and branch-update writes fire other events (auto_merge_enabled,
    # synchronize, push), which are not in this list.
    if: >-
      (github.event_name != 'pull_request_review' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      !(github.event_name == 'pull_request_target' &&
      github.event.sender.login == 'rmartz-merge-bot[bot]' &&
      contains(fromJSON('["labeled", "unlabeled", "review_requested", "review_request_removed"]'),
      github.event.action))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One run per PR at a time; a newer event supersedes an in-flight one, since
    # every run recomputes from current facts. CI-completion events are keyed by
    # head SHA, as the PR number is only known inside the action.
    concurrency:
      group: >-
        pr-lifecycle-${{ github.event.pull_request.number || inputs.pr ||
        github.event.workflow_run.head_sha || github.event.check_suite.head_sha }}
      cancel-in-progress: true
    steps:
      # No `if:` guard is needed here: every trigger that reaches this job runs
      # in the base-repo context with secrets (fork PR reviews, the one case
      # without them, are skipped by the job-level `if:` above).
      # The App's Client ID and private key are stored as both Actions and
      # Dependabot secrets (a Dependabot-triggered run sees only the latter).
      # The token is not scoped down with `permission-*` inputs: merging and
      # updating branches need contents:write on top of the read and label
      # permissions.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.MERGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_BOT_PRIVATE_KEY }}
      # The action resolves the PR from the event, including a dispatch's `pr`.
      - uses: rmartz/pr-lifecycle-action@cb58fb834f4761dcf691d6801b8ba2e23316a04a # v4.3.0
        with:
          arm-auto-merge: true
          # Bring an approved PR current when merge-safety flags `update
          # required` (never a Dependabot PR: a person or Dependabot itself
          # rebases it). The coordinator parks armed PRs, including its own
          # branch sync, so nothing else updates them (#11).
          auto-update: true
          # The App token is used for every read and label, review-request, and
          # comment write (github-token) as well as to arm, merge, disarm, and
          # update (token): a merge armed with GITHUB_TOKEN fires no `on: push`
          # workflows, so release.yml would never run. App-authored events do
          # trigger them, and the App has its own rate-limit pool, so a
          # coordinator that exhausts the user's GraphQL quota cannot fail this
          # job (rmartz/scripts#22).
          github-token: ${{ steps.app-token.outputs.token }}
          token: ${{ steps.app-token.outputs.token }}
