name: Release

# Automated releases via the fleet's shared semantic-release workflow
# (rmartz/semantic-release-ci). On every push to main it analyzes the
# Conventional-Commit history since the last `v*` tag and, when a release is
# warranted, builds and publishes @rmartz/pr-lifecycle to npmjs (public), then
# creates the git tag + GitHub Release. It commits NOTHING back to the repo (no
# @semantic-release/git), so the built-in GITHUB_TOKEN suffices — no PAT. The
# release toolchain (semantic-release, its plugins and the changelog preset) lives
# in semantic-release-ci, where a toolchain bump is tested before it reaches this
# pin; the options stay here in .releaserc.json.
#
# npm auth is OIDC trusted publishing: npmjs trusts THIS workflow file
# (`release.yml`) in rmartz/pr-lifecycle — npm validates the calling workflow's
# filename — so there is no NPM_TOKEN secret. Renaming this file breaks publishing
# until the trusted publisher on npmjs is updated to match. Provenance attestations
# are generated automatically. OIDC publishing needs npm >= 11.5.1: the shared
# workflow runs on Node 24 (npm 11) and, because this workflow grants
# `id-token: write`, fails before tagging if npm is older.
#
# `packages: read` is for INSTALLING the @rmartz/repo-hygiene devDependency from
# GitHub Packages: the shared workflow passes the job token as NODE_AUTH_TOKEN to
# its dependency install, which resolves the ${NODE_AUTH_TOKEN} placeholder in
# .npmrc. Publishing goes to npmjs because package.json's publishConfig pins both
# `registry` and `@rmartz:registry` there.

on:
  push:
    branches: [main]

# The shared workflow declares no permissions of its own; it runs with these.
# Releases are serialized per repository inside it.
permissions:
  contents: write # create tags + GitHub Releases
  packages: read # install the @rmartz/repo-hygiene devDependency
  id-token: write # npm trusted publishing (OIDC) + provenance
  issues: write # semantic-release/github comments on released issues
  pull-requests: write # semantic-release/github comments on released PRs

jobs:
  release:
    uses: rmartz/semantic-release-ci/.github/workflows/semantic-release.yml@55b1f6145b85738f94ad87c12c9d4f41ab7818b4 # v2.0.0
    with:
      # Build dist/ before the release's `npm publish` (run by
      # @semantic-release/exec in the prepare step, ahead of the tag) packs it;
      # the shared workflow installs this repo's dependencies (pnpm, frozen
      # lockfile) first.
      build-command: pnpm run build
