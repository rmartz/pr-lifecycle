# @rmartz/repo-hygiene check configuration for this repo.
# Every check runs: the Repo Hygiene workflow omits the action's `checks` input
# (so a new default-on check auto-joins on the next Dependabot bump), and the
# pre-commit hook and `pnpm run hygiene` run the CLI with no check list. Each
# check enforces at its shipped severity; this file sets options, never
# `severity`. `warn` is only ever a temporary migration ramp, never a standing
# state (see the shared repository checklist). docs/ is an OKF bundle — see
# docs/okf-format.md.
checks:
  # Intra-repo Markdown link integrity, including #anchor targets.
  docs-links:
    roots: [docs]
    anchors: true
  # Every AGENTS.md has a companion CLAUDE.md that is a bare `@AGENTS.md` wrapper.
  md-pairing:
    wrapper: '@AGENTS.md'
  # OKF docs-frontmatter conformance. This repo documents code, so it uses the
  # curated type vocabulary; `Reference` (concept/guide pages) joins the defaults
  # and is resource-exempt alongside `Design`.
  okf:
    roots: [docs]
    types: [Skill, Script, Library, Design, Reference]
    resourceExemptTypes: [Design, Reference]
  okf-index:
    roots: [docs]
  # Per-glob size caps. The shared defaults (AGENTS.md 200/300 lines, code
  # 400/600, tests 800/1200, Markdown 700/1000) already apply; these overrides
  # tighten src/ to match the eslint max-lines cap.
  file-caps:
    overrides:
      - glob: 'src/**/*.ts'
        lines: { warn: 240, error: 400 }
        bytes: { warn: 16KB, error: 24KB }
